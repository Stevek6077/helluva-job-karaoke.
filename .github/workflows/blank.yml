<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Karaoke for all occasions – Helluva Job Karaoke by J&S Entertainment. Book us for weddings, parties, and more!">
  <title>Helluva Job Karaoke</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: black;
      color: #fff;
      text-align: center;
    }

    nav {
      background-color: #222;
      padding: 1em 0;
    }

    nav a {
      color: #ffb700;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s;
    }

    nav a:focus,
    nav a:hover {
      color: #fff;
      outline: 2px solid #ffb700;
      outline-offset: 2px;
    }

    .background-overlay {
      background-color: rgba(0, 0, 0, 0.6);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .microphone {
      font-size: 4em;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 3em;
      color: #ff4c4c;
    }

    .subtitle {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 1.5em;
      color: #ffa500;
    }

    h2 {
      font-size: 2em;
      color: #00ffff;
      margin-bottom: 1em;
    }

    ul {
      list-style: none;
      padding: 0;
      font-size: 1.2em;
      max-width: 600px;
      margin: 0 auto 2em;
    }

    li {
      margin: 10px 0;
    }

    p {
      font-size: 1.1em;
      max-width: 700px;
      margin: 0 auto;
      color: #ddd;
    }

    form {
      max-width: 500px;
      margin: 2em auto;
      display: flex;
      flex-direction: column;
      gap: 1em;
    }

    label {
      text-align: left;
      margin-bottom: 0.2em;
      color: #ffa500;
      font-weight: bold;
    }

    input, textarea {
      padding: 10px;
      font-size: 1em;
      border-radius: 4px;
      border: 1px solid #555;
      background: #222;
      color: #fff;
    }

    input:focus, textarea:focus {
      outline: 2px solid #ffb700;
      border-color: #ffb700;
    }

    button, .button-link {
      padding: 10px;
      font-size: 1em;
      background-color: #ff4c4c;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
      display: inline-block;
    }

    button:focus, .button-link:focus,
    button:hover, .button-link:hover {
      background-color: #d12d2d;
    }

    .back-button {
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2em; }
      h2 { font-size: 1.3em; }
      .microphone { font-size: 2.5em; }
      .background-overlay { padding: 20px 5px; }
      form { max-width: 100%; }
    }
  </style>
  <script>
    // JavaScript unchanged
    function sendScheduleEmail(event) {
      event.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const date = document.getElementById("date").value;
      const eventType = document.getElementById("eventType").value;
      const details = document.getElementById("details").value;

      const subject = encodeURIComponent("Event Scheduling Request");
      const body = encodeURIComponent(
        `Name: ${name}\nEmail: ${email}\nDate: ${date}\nEvent Type: ${eventType}\nDetails: ${details}`
      );

      const gmailLink = `https://mail.google.com/mail/?view=cm&fs=1&to=helluvajobkaraoke@gmail.com&su=${subject}&body=${body}`;
      const defaultMailLink = `mailto:helluvajobkaraoke@gmail.com?subject=${subject}&body=${body}`;

      const userChoice = confirm("Click OK to use Gmail or Cancel to use your default email app.");
      const mailtoLink = userChoice ? gmailLink : defaultMailLink;

      window.open(mailtoLink, '_blank');
      event.target.reset();
    }

    function sendContactEmail(event) {
      event.preventDefault();
      const contactName = document.getElementById("contactName").value;
      const contactEmail = document.getElementById("contactEmail").value;
      const contactMessage = document.getElementById("contactMessage").value;

      const subject = encodeURIComponent("Contact Inquiry");
      const body = encodeURIComponent(`Name: ${contactName}\nEmail: ${contactEmail}\nMessage: ${contactMessage}`);

      const gmailLink = `https://mail.google.com/mail/?view=cm&fs=1&to=helluvajobkaraoke@gmail.com&su=${subject}&body=${body}`;
      const defaultMailLink = `mailto:helluvajobkaraoke@gmail.com?subject=${subject}&body=${body}`;

      const userChoice = confirm("Click OK to use Gmail or Cancel to use your default email app.");
      const mailtoLink = userChoice ? gmailLink : defaultMailLink;

      window.open(mailtoLink, '_blank');
      event.target.reset();
    }
  </script>
</head>
<body>
  <!-- ...Body unchanged... -->
</body>
</html>
